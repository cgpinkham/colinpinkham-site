<!doctype html><html lang="en" class="no-js"><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{--ink:#172321;--paper:#f5f3ed;--surface:#fbfaf6;--line:#d8d9d2}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial}.shell{padding:0 20px}.header{border-bottom:1px solid var(--line);position:relative}.header-inner{height:68px;display:flex;align-items:center;gap:36px}.wordmark{margin-right:auto;font-weight:700}.desktop-nav,.contact-link{display:none!important}.mobile-menu-button{display:flex;align-items:center;justify-content:center;flex-direction:row;gap:8px;width:auto;min-width:78px;height:42px;padding:0 12px;border:1px solid var(--ink);background:var(--surface);color:var(--ink);cursor:pointer;flex:0 0 auto;font:600 12px Arial;text-transform:uppercase;letter-spacing:.08em}.mobile-menu-button span{display:block;width:17px;height:2px;background:currentColor}.mobile-menu-button b{font:600 12px Arial}.mobile-menu{position:absolute;left:0;right:0;top:68px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px 20px 20px;z-index:100}.no-js .mobile-menu{display:block}.js .mobile-menu{display:none}.js .mobile-menu.is-open{display:block}.mobile-menu nav{display:flex;flex-direction:column;gap:0;font-size:17px}.mobile-menu nav a{display:block;padding:13px 0;border-bottom:1px solid var(--line)}.mobile-contact{display:block;margin-top:14px;padding:12px 15px;border:1px solid var(--ink);text-align:center}.js .mobile-menu-button[aria-expanded="true"] span:nth-child(1){transform:translateY(5px) rotate(45deg)}.js .mobile-menu-button[aria-expanded="true"] span:nth-child(2){opacity:0}.js .mobile-menu-button[aria-expanded="true"] span:nth-child(3){transform:translateY(-5px) rotate(-45deg)}.js .mobile-menu-button[aria-expanded="true"] b{font-size:0}.js .mobile-menu-button[aria-expanded="true"] b:after{content:'Close';font-size:12px}
</style></head><body><header class="header"><div class="shell header-inner"><a class="wordmark" href="/">COLIN PINKHAM.</a><nav class="desktop-nav"><a>About</a><a>Work</a><a>Career</a><a>Thinking</a><a>CV</a></nav><button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-expanded="false" aria-controls="mobile-primary"><span></span><span></span><span></span><b>Menu</b></button><div class="mobile-menu" id="mobile-primary"><nav><a>About</a><a>Work</a><a>Career</a><a>Thinking</a><a>CV</a></nav><a class="mobile-contact">Contact</a></div><a class="contact-link">Contact</a></div></header><script>document.documentElement.classList.remove('no-js');document.documentElement.classList.add('js');const b=document.getElementById('mobile-menu-button'),m=document.getElementById('mobile-primary');b.addEventListener('click',()=>{const o=m.classList.toggle('is-open');b.setAttribute('aria-expanded',String(o))});setTimeout(()=>b.click(),100);</script></body></html>
